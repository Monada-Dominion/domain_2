<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Initial Theory</title>
    <link rel="stylesheet" href="assets/css/theory.css">
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">[back to menu]</a>
        <h2></h2>
        <div class="figure-icons" aria-label="Detected meditation figures"></div>
        <div class="content"></div>
        <a href="index.html" class="back-link">[back to menu]</a>
    </div>
    <script>
    function getFigureImageFiles(contentId) {
        const m = /^meditation_(\d+)_(\d+)_(\d+)$/.exec(contentId || '');
        if (!m) return [];

        const domain = Number(m[1]);
        const block = Number(m[2]);
        const card = Number(m[3]);

        if (domain !== 2) return [];

        if (block === 1 && card >= 1 && card <= 8) {
            return ['1.jpg'];
        }
        if (block === 1 && card >= 9 && card <= 12) {
            return ['1.jpg', '5.jpg'];
        }
        if (block === 2 && card >= 1 && card <= 4) {
            return ['5.jpg'];
        }

        return [];
    }

    function renderFigureIcons(contentId) {
        const iconContainer = document.querySelector('.figure-icons');
        if (!iconContainer) return;

        const files = getFigureImageFiles(contentId);
        if (!files.length) {
            iconContainer.style.display = 'none';
            iconContainer.innerHTML = '';
            return;
        }

        iconContainer.style.display = 'flex';
        iconContainer.style.gap = '12px';
        iconContainer.style.flexWrap = 'wrap';
        iconContainer.style.alignItems = 'center';
        iconContainer.style.margin = '6px 0 16px';
        iconContainer.innerHTML = files
            .map(file => `<img src="assets/images/${file}" alt="Meditation figure" style="width:72px;height:72px;object-fit:contain;">`)
            .join('');
    }

    function markdownToHtml(md) {
        return md
            .replace(/^### (.*$)/gim, '<h3>$1</h3>')
            .replace(/^## (.*$)/gim, '<h2>$1</h2>')
            .replace(/^# (.*$)/gim, '<h1>$1</h1>')
            .replace(/^---$/gim, '<hr>')
            .replace(/^> (.*$)/gim, '<blockquote>$1</blockquote>')
            .replace(/\*\*(.*?)\*\*/gim, '<b>$1</b>')
            .replace(/\*(.*?)\*/gim, '<i>$1</i>')
            .replace(/`([^`]+)`/gim, '<code>$1</code>')
            .replace(/^\s*\n/gim, '<br>')
            .replace(/^\s*\n/gim, '<br>')
            .replace(/\n\n/gim, '<br><br>')
            .replace(/^\s*\n/gim, '<br>')
            .replace(/^- (.*$)/gim, '<li>$1</li>')
            .replace(/<li>(.*?)<\/li>/gim, '<ul><li>$1</li></ul>')
            .replace(/\n/g, '<br>');
    }
    document.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const content = urlParams.get('content') || 'meditation_2_1_1';
        const header = document.querySelector('h2');
        const contentContainer = document.querySelector('.content');
        fetch(`assets/md/${content}.md`)
            .then(response => response.text())
            .then(data => {
                const lines = data.split('\n');
                header.innerText = lines[0].trim();
                renderFigureIcons(content);
                contentContainer.innerHTML = markdownToHtml(lines.slice(1).join('\n'));
            })
            .catch(error => console.error('Error loading content:', error));
    });
    </script>
</body>
</html>
